# Temporary workflow: transparent, one-time historical contribution reconstruction.
# Dates are user-selected calendar regions, not verified original development events.
name: One-time history supplement
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-history-supplement.yml'
permissions:
  contents: write
concurrency:
  group: one-time-history-supplement-main
  cancel-in-progress: false
jobs:
  supplement:
    if: "github.event.head_commit.message == 'chore(ci): launch one-time history supplement'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add historical calendar markers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Cardioider'
          git config user.email '228460677+Cardioider@users.noreply.github.com'
          dates=(
            2025-11-16
            2025-11-23
            2025-11-30
            2026-02-28
            2026-03-03
            2026-03-10
            2026-03-13
            2026-03-20
            2026-03-23
            2026-03-30
            2026-04-02
            2026-04-09
            2026-04-12
            2026-04-19
            2026-04-22
            2026-04-29
            2026-05-02
            2026-05-09
            2026-05-12
            2026-05-19
            2026-05-22
            2026-05-29
            2026-06-01
            2026-06-08
            2026-06-11
            2026-06-18
            2026-06-21
            2026-06-28
            2026-07-01
            2026-08-18
            2026-08-21
            2026-08-27
            2026-08-30
            2026-09-05
            2026-09-08
            2026-09-14
            2026-09-17
            2026-09-23
            2026-09-26
            2026-10-02
            2026-10-05
            2026-10-11
            2026-10-14
            2026-10-19
            2026-10-22
          )
          for day in "${dates[@]}"; do
            message="archive: reconstructed calendar marker (${day})"
            if git log --all --format=%s | grep -Fxq "${message}"; then
              echo "Already present: ${day}"
              continue
            fi
            GIT_AUTHOR_DATE="${day}T12:00:00+08:00" git commit --allow-empty \
              -m "${message}" \
              -m "Retrospective calendar marker created on 2026-10-30. This is not a recovered original commit. Development on this precise day has not been independently verified."
          done
          git push origin HEAD:main
